# Tests on Node.js 22, 24 and 26 (docs/decisions.md D-007), including the LibreOffice check of
# written files (D-209). Actions are pinned to commit SHAs (D-210); the comment gives the tag.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install LibreOffice Calc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-calc
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          XLV_REQUIRE_LIBREOFFICE: '1'
      - run: npm run check:pkg
