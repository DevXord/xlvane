# Releases from a tag vX.Y.Z (docs/RELEASING.md, docs/decisions.md D-1002 … D-1004). The publish
# job uses npm trusted publishing (OIDC, no tokens or secrets) and stages the packages with
# `npm stage publish`; a maintainer approves them with 2FA before they become public. Provenance
# is generated automatically by trusted publishing from a public repository. Actions are pinned to
# commit SHAs (D-210); the comment gives the tag.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - name: Check the tag against the package versions
        run: node scripts/check-release-version.mjs "$GITHUB_REF_NAME"
      - name: Install LibreOffice Calc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-calc
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
        env:
          XLV_REQUIRE_LIBREOFFICE: '1'
      - run: npm run check:pkg
      - run: npm run test:runtimes

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    # A GitHub environment, so that the maintainer can require a review before this job runs.
    environment: npm-release
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      # Staged publishing needs npm 11.15.0 or later (F-NPM-02).
      - run: npm install -g npm@11.21.1
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-release-version.mjs "$GITHUB_REF_NAME"
      - run: npm stage publish -w packages/xlvane
      - run: npm stage publish -w packages/exceljs
