name: Bug report
description: Something in xlvane, @xlvane/compat or the xlvane command does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For a security problem, do not open an issue: report it privately as described in SECURITY.md.
        For a question about how to use xlvane, please ask in the Q&A category of Discussions instead: https://github.com/DevXord/xlvane/discussions/categories/q-a
        Please attach a workbook only if it holds no private data.
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `npm ls xlvane @xlvane/compat` or `xlvane --version`.
      placeholder: xlvane 1.1.0
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Node.js
        - Bun
        - Deno
        - Browser
        - Cloudflare Workers
        - Other
    validations:
      required: true
  - type: input
    id: runtime-version
    attributes:
      label: Runtime version and operating system
      placeholder: Node.js 22.18.0 on Windows 11
  - type: textarea
    id: steps
    attributes:
      label: Code or command that shows the problem
      description: A small script or command. The error printed, including its XLV_E_ code, helps.
      render: ts
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
    validations:
      required: true
